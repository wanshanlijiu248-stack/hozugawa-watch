name: watch

on:
  schedule:
    - cron: "*/5 * * * *"   # 5分おき(混雑時は数分〜十数分遅れることがあります)
  workflow_dispatch:         # 手動実行ボタン用

concurrency:
  group: watch
  cancel-in-progress: false   # 前の確認が終わるまで次を待たせる(重複実行の防止)

permissions:
  actions: write            # 空き通知後に自分自身を停止/過去の実行結果の参照
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1

      - name: Install
        run: |
          pip install playwright requests
          playwright install chromium

      - name: Check availability
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python monitor.py --once
          code=$?

          if [ "$code" -eq 10 ]; then
            echo "空きを検知して通知しました。通知の連続送信を防ぐため、この監視を停止します。"
            gh workflow disable watch.yml
            exit 0
          fi

          if [ "$code" -ne 0 ]; then
            # 直前の完了済みの実行結果を取得
            prev=$(gh run list --workflow watch.yml --status completed --limit 1 --json conclusion -q '.[].conclusion')
            echo "直前の結果: $prev"
            # 失敗の1回目だけ通知(失敗が続いても連投しない。一度成功すると、次の失敗でまた通知)
            if [ "$prev" != "failure" ]; then
              python monitor.py --send "⚠️ 監視エラー" "確認に失敗しました。GitHubのActionsでログを確認してください。(サイトの表示変更やアクセス制限の可能性)"
            fi
          fi
          exit $code
